<!doctype html>
<html lang="fr" class="theme-nads">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'" />
  <title>PouleyPwolu</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="onboarding.css" />
</head>
<body class="side-left">
  <div id="app">
    <!-- Barre latérale façon Arc -->
    <aside id="sidebar">
      <div id="side-resizer" class="side-resizer" title="Glisser pour redimensionner — tout au bord pour masquer"></div>
      <div class="side-head drag">
        <div class="brand" id="brand" title="PouleyPwolu"></div>
        <div class="nav no-drag">
          <button class="icon-btn" data-cmd="tab.back" id="btn-back" title="Précédent (Alt+←)"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
          <button class="icon-btn" data-cmd="tab.forward" id="btn-forward" title="Suivant (Alt+→)"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
          <button class="icon-btn" id="btn-reload" title="Recharger (Ctrl+R)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
          <button class="icon-btn" id="btn-hide-sidebar" title="Masquer la barre (Ctrl+S)"></button>
        </div>
        <div class="winctl no-drag" id="winctl">
          <button data-cmd="window.minimize" title="Réduire"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
          <button data-cmd="window.maximize" title="Agrandir"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg></button>
          <button data-cmd="window.close" class="close" title="Fermer"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
        </div>
      </div>

      <div class="url-row no-drag">
        <div class="urlbox" id="urlbox-wrap">
          <button id="urlbox" class="url-main" title="Modifier l’adresse (Ctrl+L)">
            <span id="url-lock" class="lock"></span>
            <span id="url-text" class="url-text">Nouvel onglet</span>
          </button>
          <button id="btn-shot" class="url-act" title="Capture d’écran du site (Ctrl+Maj+S)"></button>
          <button id="btn-pen" class="url-act" title="Stylo : écrire sur la page puis capturer (Ctrl+Maj+D)"></button>
          <button id="btn-float" class="url-act" title="Mettre en superposition : le site flotte au-dessus de tes fenêtres (Ctrl+Maj+P)"></button>
          <button id="btn-repo" class="url-act hidden" title="Dépôt"></button>
          <button id="btn-split" class="url-act" title="Mettre côte à côte : deux sites dans la même fenêtre (Ctrl+Maj+K)"></button>
          <button id="shield" class="shield" title="Bouclier : traqueurs bloqués — ouvrir le rapport (Ctrl+I)">
            <svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6z"/></svg>
            <span id="shield-count">0</span>
          </button>
        </div>
      </div>

      <div class="tools-row toolbar no-drag" role="toolbar" aria-label="Outils">
        <button class="tool" id="btn-inspector" title="Inspecteur : vie privée, technos, couleurs (Ctrl+I)">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><span>Inspecter</span>
        </button>
        <button class="tool" id="btn-ai" title="Assistant IA (Ctrl+E)">
          <span id="ai-logo" class="logo-slot"></span><span id="ai-label">IA</span>
        </button>
        <div id="ext-bar" class="ext-bar"></div>
      </div>

      <div class="side-label no-drag" id="fav-label">Favoris</div>
      <div id="favorites" class="fav-grid no-drag" data-drop="favorites"></div>

      <div class="poulailler-head no-drag">
        <button id="poulailler-title" class="poulailler-title" title="Modifier ce poulailler">
          <span id="poulailler-icon" class="p-badge"></span><span id="poulailler-name">Perso</span>
        </button>
        <span id="poulailler-lock" class="badge-iso" title="Cookies isolés des autres poulaillers">isolé</span>
        <button class="tool focus-tool" id="btn-focus" title="Productivité : plumes = temps utile, tenders = temps sur les sites qui distraient">
          <span class="fc-ic" id="fc-plume"></span><b id="fc-plumes">0</b><span class="fc-ic" id="fc-tender"></span><b id="fc-tenders">0</b>
        </button>
        <button id="btn-group-auto" class="icon-btn egg-auto-btn" title="Ranger les onglets en groupes d’œufs"></button>
      </div>

      <div class="lists no-drag">
        <button id="btn-pinned" class="pinned-btn hidden" title="Pages épinglées de ce poulailler"></button>
        <div id="pinned" class="tab-list pinned" data-drop="pinned"></div>
        <div class="divider"><span></span></div>
        <button id="btn-newtab" class="new-tab"><span class="plus">+</span> Nouvel onglet <kbd>Ctrl T</kbd></button>
        <div id="tabs" class="tab-list" data-drop="tabs"></div>
        <button id="btn-all-tabs" class="icon-btn all-tabs" title="Tous les onglets"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>

      <div id="mini-player" class="mini-player no-drag hidden">
        <button class="mp-art" id="mp-art" title="Aller à la musique"></button>
        <button class="mp-txt" id="mp-txt" title="Aller à la musique"><b id="mp-title"></b><span id="mp-sub"></span></button>
        <div class="mp-ctl">
          <button class="icon-btn" id="mp-prev" title="Précédent"><svg viewBox="0 0 24 24"><path d="M7 5v14M19 6l-9 6 9 6z" fill="currentColor"/></svg></button>
          <button class="icon-btn mp-play" id="mp-toggle" title="Lecture / pause"></button>
          <button class="icon-btn" id="mp-next" title="Suivant"><svg viewBox="0 0 24 24"><path d="M17 5v14M5 6l9 6-9 6z" fill="currentColor"/></svg></button>
        </div>
        <div class="mp-bar"><i id="mp-progress"></i></div>
      </div>

      <div class="side-foot no-drag">
        <button class="icon-btn" id="btn-archive" title="Archive des onglets"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/></svg></button>
        <div id="poulaillers" class="spaces"></div>
        <button class="icon-btn" id="btn-add-space" title="Nouveau poulailler"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="icon-btn" id="btn-vault" title="Coffre à mots de passe"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/></svg></button>
        <button class="icon-btn" id="btn-settings" title="Paramètres (Ctrl+,)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3.6 15H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9.7 4.6V4a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></button>
      </div>
    </aside>

    <div id="edge-hot" class="edge-hot"></div>

    <main id="main">
      <div id="banners"></div>
      <div id="findbar" class="findbar hidden">
        <input id="find-input" placeholder="Rechercher dans la page…" spellcheck="false" />
        <span id="find-count"></span>
        <button class="icon-btn" id="find-prev" title="Précédent"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
        <button class="icon-btn" id="find-next" title="Suivant"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <button class="icon-btn" id="find-close" title="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div id="workspace">
        <section id="content" class="panel">
          <div id="floating-note" class="empty hidden">
            <div class="float-ill" id="float-ill"></div>
            <h1>Ce site flotte au-dessus de tes fenêtres</h1>
            <p id="floating-site"></p>
            <div class="row-actions" style="justify-content:center">
              <button class="btn primary" id="btn-dock">Ramener ici</button>
              <button class="btn" id="btn-show-float">Afficher la fenêtre</button>
            </div>
          </div>
          <div id="split-ring" class="split-ring hidden"></div>
          <div id="split-divider" class="split-divider hidden" title="Glisser pour régler · Double-clic : moitié / moitié · Clic droit : options"><i></i></div>
          <div id="split-ghosts" class="split-ghosts hidden"><div class="ghost a"></div><div class="ghost b"></div></div>
          <div id="shot-layer" class="shot-layer hidden"><div class="shot-hint">Glisse pour sélectionner une zone · Échap pour annuler</div><div class="shot-rect hidden" id="shot-rect"></div></div>
          <div id="empty" class="empty hidden">
            <div class="empty-poule" id="empty-poule"></div>
            <h1 id="empty-title">Poulailler vide</h1>
            <p>Ouvre un onglet avec <kbd>Ctrl</kbd> <kbd>T</kbd>, ou tape directement :</p>
            <button id="empty-search" class="empty-search">Rechercher ou saisir une adresse…</button>
          </div>
        </section>
        <aside id="ai-panel" class="side-panel hidden">
          <header>
            <div class="seg" id="ai-switch"></div>
            <button class="icon-btn" data-cmd="ai.askPage" title="Résumer la page actuelle"><svg viewBox="0 0 24 24"><path d="M5 5h14v10H8l-3 3z"/></svg></button>
            <button class="icon-btn" data-cmd="ai.home" title="Nouvelle conversation"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
            <button class="icon-btn" data-cmd="ai.toggle" title="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          </header>
          <div id="ai-slot" class="slot"></div>
        </aside>
        <aside id="inspector" class="side-panel hidden">
          <header>
            <div class="seg" id="insp-tabs">
              <button data-tab="privacy" class="on">Vie privée</button>
              <button data-tab="tech">Technos</button>
              <button data-tab="design">Charte</button>
              <button data-tab="ai" title="Textes et images générés par IA ?">IA ?</button>
            </div>
            <button class="icon-btn" id="insp-refresh" title="Analyser à nouveau"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
            <button class="icon-btn" id="insp-close" title="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          </header>
          <div id="insp-body" class="insp-body"></div>
        </aside>
      </div>
    </main>
  </div>

  <div id="overlay" class="overlay hidden"></div>
  <div id="toasts" class="toasts"></div>
  <div id="onboarding" class="onboarding hidden"></div>

  <script src="../shared/sprites.js"></script>
  <script src="../shared/icons.js"></script>
  <script src="../shared/tech-icons.js"></script>
  <script src="../shared/brand-logos.js"></script>
  <script src="../shared/config.js"></script>
  <script src="cluck.js"></script>
  <script src="onboarding.js"></script>
  <script src="inspector.js"></script>
  <script src="app.js"></script>
</body>
</html>
