  fin:
    needs: etape-16
    runs-on: ubuntu-latest
    steps:
      - name: Compilation terminée ?
        run: |
          if [ "${{ needs.etape-16.outputs.finished }}" != "true" ]; then
            echo "La compilation n'a pas fini en 16 étapes."
            exit 1
          fi
