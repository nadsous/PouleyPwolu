# Compile PouleyPwolu (moteur Firefox, Windows x64) sur une machine GitHub gratuite.
# Lancement : onglet Actions → moteur-windows → Run workflow, ou un tag « moteur-<version> ».
# Résultat : l'artefact « pouleypwolu-windows » (installateur PouleyPwolu et zip).
name: moteur-windows
on:
  workflow_dispatch:
  push:
    tags:
      - 'moteur-*'

permissions:
  contents: read

concurrency:
  group: moteur-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 355
    env:
      POULEY_WORK: D:\pwff
      MOZBUILD_STATE_PATH: D:\mozbuild
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: MozillaBuild
        shell: pwsh
        run: |
          Invoke-WebRequest https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe -OutFile $env:RUNNER_TEMP\mb.exe
          $sig = Get-AuthenticodeSignature $env:RUNNER_TEMP\mb.exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Mozilla Corporation') { throw 'Signature de MozillaBuild invalide' }
          Start-Process $env:RUNNER_TEMP\mb.exe -ArgumentList '/S' -Wait

      - name: Préparer les sources
        shell: pwsh
        run: |
          pip install pillow
          python scripts/prepare.py

      - name: Outils de compilation
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build.ps1 -Etape bootstrap

      - name: Compiler
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build.ps1 -Etape build

      - name: Paquet et installateur
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build.ps1 -Etape package
          powershell -ExecutionPolicy Bypass -File scripts\package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: pouleypwolu-windows
          path: release/moteur/*
          if-no-files-found: error
